# PiZZa -- Zephyr on the Raspberry Pi Zero 2 W, all-features image.
#
# Console split:
#   - Boot logs + LOG_* on the board-default PL011 / mini-UART (whatever
#     zephyr,console points at).
#   - Interactive shell on USB CDC ACM (zephyr,shell-uart in the overlay).

# ---------------------------------------------------------------------
# Shell + banner
# ---------------------------------------------------------------------
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_BOOT_DELAY=200

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=8192
# IMPORTANT: shell log backend OFF. Logs go only to LOG_BACKEND_UART
# (the board mini-UART, zephyr,console) so the shell prompt stays
# clean. Driving high-volume log streams (brcmfmac, udc_dwc2, ...)
# through the shell log backend races the prompt redraw and the
# rendered prompt ends up in the input line. Must be explicit =n;
# Kconfig defaults this on whenever SHELL + LOG are both enabled.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_HWINFO_SHELL=y
CONFIG_DATE_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Per-subsystem shell commands
CONFIG_SENSOR_SHELL=y
CONFIG_SPI_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_I2S=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# ---------------------------------------------------------------------
# Logging (on the board console, not on the shell UART)
# ---------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# Per-module log levels: silence the USB driver INF chatter that
# fires on every OUT packet, keep the rest at INF for visibility.
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_BCM2835_FIRMWARE_LOG_LEVEL_INF=y

# ---------------------------------------------------------------------
# USB device stack -- CDC ACM as the shell endpoint
# ---------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
# Don't auto-init; main.c uses sample_usbd_init_device() so we can
# register a USBD msg_cb (needed to detect CDC DTR rising edge for
# the banner-on-connect feature; uart_line_ctrl_get(DTR) doesn't work
# on this driver).
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Branding for the sample_usbd_init helper.
CONFIG_SAMPLE_USBD_PRODUCT="PiZZa -- Zephyr on rpi_zero_2w"
CONFIG_SAMPLE_USBD_MANUFACTURER="jetpax/PiZZa"
CONFIG_SAMPLE_USBD_PID=0xCAFE

# AArch64 USBD/UDC stacks: upstream defaults overflow when CDC ACM
# usbd_thread runs through the shell. Hard-won values; see
# feedback_zephyr_usbd_stack_sizes_aarch64.
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# ---------------------------------------------------------------------
# VC mailbox + firmware (USB PHY power-on, board serial, die-temp)
# ---------------------------------------------------------------------
CONFIG_BCM2835_MBOX=y
CONFIG_BCM2835_FIRMWARE=y
CONFIG_HWINFO=y
CONFIG_SENSOR=y

# ---------------------------------------------------------------------
# Storage stack on the external microSD slot (SDHost)
# ---------------------------------------------------------------------
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_SDMMC_SUBSYS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y

# ---------------------------------------------------------------------
# DMA + SPI + I2C + I2S
# ---------------------------------------------------------------------
CONFIG_DMA=y
CONFIG_SPI=y
CONFIG_I2C=y
# CONFIG_I2S already set above (paired with shell)

# ---------------------------------------------------------------------
# Networking + Wi-Fi (CYW43439 via brcmfmac over SDIO)
# ---------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOG=y

CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

# Stack bumps (hard-won)
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=5200

# brcmfmac (BCDC RX buffer is a build-time #define on this branch,
# defaults to 8192 which is fine).
CONFIG_WIFI=y
CONFIG_WIFI_BRCMFMAC=y
CONFIG_WIFI_LOG_LEVEL_INF=y

# ---------------------------------------------------------------------
# Entropy (BCM2835 RNG)
# ---------------------------------------------------------------------
CONFIG_ENTROPY_GENERATOR=y
