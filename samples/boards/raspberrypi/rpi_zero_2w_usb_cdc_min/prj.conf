# USB device stack (new / device_next)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y

# Force PIO mode. The driver defaults UDC_DWC2_DMA=y when the chip
# advertises Internal DMA in GHWCFG2.OtgArch (BCM2710 does, value=2),
# but on this Apple Silicon host the driver's DMA path is unsafe:
# it writes the buffer's virtual address (32-bit truncated) to
# DOEPDMA and assumes the controller can use it as a physical
# address, and does no cache maintenance for the AHB master's
# accesses to the buffer. Identity-mapped RAM masks the VA/PA
# issue, but cache coherency would still cause silent data
# corruption. Phase 2.1 of the bring-up turned this up. PIO is
# the simpler / correct path for first enumeration; DMA mode is a
# sequel that needs CONFIG_CACHE_MANAGEMENT and a real driver-side
# coherency strategy.
CONFIG_UDC_DWC2_DMA=n

# CDC ACM class — turnkey init at SYS_INIT (no manual usbd_init/enable
# required; the class brings the stack up by itself).
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# VideoCore mailbox + firmware property-tag interface. Required by
# the DWC2 vendor pre_enable hook to power on the USB analog PHY
# island (Phase 2.4 -- without this VC leaves the island off and
# D+/D- aren't electrically driven even though the controller's MMIO
# is fully accessible). BCM2835_FIRMWARE default-y picks these up
# once the &mailbox / &firmware nodes are enabled in the overlay.
CONFIG_BCM2835_MBOX=y
CONFIG_BCM2835_FIRMWARE=y

# HWINFO via VC firmware property GET_BOARD_SERIAL. USBD framework
# fills the iSerialNumber string descriptor from hwinfo_get_device_id;
# without this, the Mac STALL-spams trying to retrieve string idx 3
# during enumeration (the device works anyway, but every boot log
# has 3-4 "HWINFO not implemented or enabled" protocol-error lines).
# HWINFO_BCM2835 default-y depends on BCM2835_FIRMWARE + SOC_BCM2710.
CONFIG_HWINFO=y

# USB stack thread stacks. Upstream defaults (USBD=1024, UDC_DWC2=512)
# are tight for AArch64; the DIN-event call chain (DWC2 ISR ->
# usbd_thread -> usbd_ch9 -> CDC ACM class -> LOG_INF) blows past
# them and the resulting overflow scribbles a function-pointer-shaped
# value onto the saved LR slot, so RET dispatches into .rodata =
# PXN fault. Same family as memory reference_zephyr_net_thread_stack_
# sizes (brcmfmac TCP workq bump). 4 KiB is generous but cheap in
# our 256 MiB RAM budget.
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096

# Stack sentinel: writes a magic value at the bottom of every
# thread's stack and ASSERTs if it's clobbered. Catches overflow
# at the moment of the overwrite (or shortly after, at the next
# thread switch / check point), not 30 frames later when a corrupted
# pointer dispatches into garbage. Memory:
# feedback_zephyr_stack_sentinel_for_corruption_hunts.
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# PL011 console + LOG. Keep INF on the CDC class and the VC firmware
# driver so we see one line each at boot: "device 3 power -> ON",
# "board serial: ...", "CDC ACM device ready". Force UDC driver to
# WRN (its INF default fires "Prepare RX" several times per SETUP
# during enumeration -- not useful in steady state). Enable DBG
# locally if regressing the bring-up flow.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USBD_CDC_ACM_LOG_LEVEL_INF=y
CONFIG_BCM2835_FIRMWARE_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
