# USB device stack (new / device_next)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DWC2=y
CONFIG_UDC_DWC2_DMA=n

# CDC ACM class -- turnkey init at SYS_INIT.
CONFIG_SERIAL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# VC mailbox + firmware (USB PHY power-on via SET_POWER_STATE +
# board serial via GET_BOARD_SERIAL for iSerialNumber).
CONFIG_BCM2835_MBOX=y
CONFIG_BCM2835_FIRMWARE=y
CONFIG_HWINFO=y

# AArch64 USBD/UDC stack bumps -- defaults overflow on the
# usbd_thread call chain through CDC ACM + shell. Stack sentinel
# is a future-tripwire (memory:
# feedback_zephyr_stack_sentinel_for_corruption_hunts).
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_UDC_DWC2_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y

# Shell subsystem on the CDC ACM UART (selected via chosen
# `zephyr,shell-uart` in the app overlay). The shell starts its
# own thread; main() just goes idle. Routing logs through the
# shell backend keeps the prompt readable even when LOG_INF fires
# mid-line.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y

# Useful shell commands for poking at the device:
#   `device list`        - all bound devices incl. DWC2 controller
#   `kernel threads`     - see usbd / udc / shell stack usage
#   `hwinfo devid`       - prints the 64-bit Pi OTP serial
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_HWINFO_SHELL=y

# PL011 console + LOG. Boot logs still go to PL011 (the chosen
# zephyr,console); shell I/O is on USB CDC ACM. Quiet defaults
# elsewhere -- enable DBG locally if regressing the bring-up flow.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_USBD_CDC_ACM_LOG_LEVEL_INF=y
CONFIG_BCM2835_FIRMWARE_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
