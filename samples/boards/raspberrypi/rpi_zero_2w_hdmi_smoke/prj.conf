# HDMI bring-up smoke test for rpi_zero_2w.
#
# Asks VideoCore for a 640x480 ARGB framebuffer via the property-tag
# mailbox and cycles the screen through pure-red / green / blue, then
# draws vertical color bars. If the cable shows the expected colors
# in the expected order, the FB driver + pixel-order are correct.

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

CONFIG_DISPLAY=y
CONFIG_BCM2835_FB=y

# Property-tag chain depends on the mailbox + firmware modules.
CONFIG_BCM2835_MBOX=y
CONFIG_BCM2835_FIRMWARE=y

# Log the FB allocation + actual mode at INF.
CONFIG_BCM2835_FIRMWARE_LOG_LEVEL_INF=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
