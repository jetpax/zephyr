CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# rpi_zero_2w / bcm2710 SoC's IPI ISR references sched_ipi_handler
# unguarded; SMP must be on for the link to resolve. We don't use the
# secondary cores in the smoke test, but we still need the symbol.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_SPINTABLE=y
CONFIG_FPU_SHARING=n

# arch_cpu_start uses sys_cache_data_flush_range to publish
# arm64_cpu_boot_params to the parked secondary cores; without
# CACHE_MANAGEMENT the flush is a no-op and the secondary's voting
# loop in reset.S never sees the new mpid -- cpu 0 hangs in wfe and
# main() never runs. The wipeout build pulls this in transitively
# via sdhc_bcm2835's `select`; a minimal build like this needs it
# explicit.
CONFIG_CACHE_MANAGEMENT=y

# Bring up the firmware mailbox + V3D compute driver.
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_BCM2835_V3D=y

# Driver chatter helps the smoke test land readable diagnostics on
# the UART before we have any application-level output of our own.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BCM2835_V3D_LOG_LEVEL=4
