CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# Same SMP gating as qpu_smoke -- BCM2710's IPI ISR references
# sched_ipi_handler unconditionally; SMP must be on for the link.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=4
CONFIG_SCHED_CPU_MASK=y
CONFIG_SCHED_CPU_MASK_PIN_ONLY=y
CONFIG_PM_CPU_OPS=y
CONFIG_PM_CPU_OPS_SPINTABLE=y
CONFIG_FPU_SHARING=n

# arch_cpu_start uses sys_cache_data_flush_range to publish boot
# params to the parked secondary cores; without CACHE_MANAGEMENT that
# flush is a no-op, secondaries never wake, and main() never runs.
CONFIG_CACHE_MANAGEMENT=y

CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_BCM2835_V3D=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BCM2835_V3D_LOG_LEVEL=4

# Math.h sqrtf etc -- minimal libc is fine, but we want printf
# floating point so we can log per-vertex error magnitudes if needed.
CONFIG_PICOLIBC_IO_FLOAT=y
