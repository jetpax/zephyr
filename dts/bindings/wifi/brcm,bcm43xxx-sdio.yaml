description: |
    Broadcom BCM43xxx SDIO Wi-Fi (brcmfmac protocol).

    Covers the SDIO-attached Broadcom/Cypress combo chips that share the
    brcmfmac SDPCM+BCDC protocol -- BCM43430A1 on the Pi Zero 2 W /
    CYW43439 module, BCM4334x, etc. Chip identity is read at runtime from
    chipcommon[0] on the AXI/SB backplane; the driver picks firmware/NVRAM
    blobs from that runtime ID, not from the binding.

    The node is a child of an SDHC controller. The driver reaches the
    SDHC parent via DT_INST_PARENT(0).

compatible: "brcm,bcm43xxx-sdio"

include: base.yaml

properties:
  wifi-reg-on-gpios:
    description: |
      Power / regulator-enable GPIO ("WL_REG_ON" on Cypress modules).
      Optional: on boards where the SoC firmware (e.g. the Pi VPU)
      asserts this before Zephyr starts, the driver leaves it alone --
      toggling LOW->HIGH disturbs the chip PMU.
    type: phandle-array

  wifi-host-wake-gpios:
    description: |
      Optional host-wake GPIO. When the chip wants attention it drives
      this line; the driver wakes its RX thread from the IRQ.
      Not wired on Pi Zero 2 W (host-wake is in-band over DAT1, picked
      up when the SDHC driver gains SDIO-IRQ support).
    type: phandle-array

  firmware-name:
    description: |
      Base name of the firmware/NVRAM blobs in linux-firmware naming
      ("brcmfmac43436s-sdio"). Driver appends ".bin"/".txt".
      Phase 4 v1 expects blobs embedded in the driver build; Phase 5
      will resolve against a filesystem path.
    type: string
