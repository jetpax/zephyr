description: |
  Allwinner H618 CCU (clock control unit) register block. No clock
  driver yet; peripheral drivers that need CCU bits reference this
  node for the MMIO base and poke their own registers.

compatible: "allwinner,sun50i-h618-ccu"

include: base.yaml

properties:
  reg:
    required: true
