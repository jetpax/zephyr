description: Broadcom BCM2711 pin controller

compatible: "brcm,bcm2711-pinctrl"

include: base.yaml

properties:
  reg:
    required: true

  legacy-pull-control:
    type: boolean
    description: |
      The pull-control register layout differs across the BCM283x family:

        - BCM2711 (Pi 4): GPIO_PUP_PDN_CNTRL_REG at offset 0xE4. Modern
          single-write; this is the binding's default.
        - BCM2835 / BCM2836 / BCM2837 / BCM2710 (Pi 1..3, Pi Zero, Pi
          Zero 2 W): legacy GPPUD / GPPUDCLK0 / GPPUDCLK1 sequence at
          offsets 0x94 / 0x98 / 0x9C; offset 0xE4 is reserved.

      Set this property on nodes that target BCM2710 / BCM2835-family
      silicon. The peripheral compatible (brcm,bcm2711-pinctrl) is shared
      because every other register in the controller behaves the same;
      only the pull-control sequence differs.

child-binding:
  description: |
    Pin configuration state nodes.

  child-binding:
    description: |
      Pin configuration group.

      Each group within a pin configuration state contains pins that share
      the same bias (pull-up/pull-down) configuration.

    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - bias-disable
          - bias-pull-down
          - bias-pull-up

    properties:
      pinmux:
        type: array
        required: true
        description: |
          An array of pins for this group. Each element is encoded as:
          - Bits 0-7: Pin number (0-57)
          - Bits 8-10: Function select (0-7)

          Use BCM2711_PINMUX(pin, func) to construct values.
