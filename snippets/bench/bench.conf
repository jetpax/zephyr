# Bench liveness: every image ends at a usable shell with PSCI reset
# commands, so the UART always answers and `psci cold` always offers a
# path back to FEL. Applies to test images too -- ztest runs first,
# then the prompt is live.
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_PM_CPU_OPS=y
CONFIG_PSCI_SHELL=y
CONFIG_REBOOT=y
